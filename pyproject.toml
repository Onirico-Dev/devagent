[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devagent"
version = "0.6.8"
description = "DevAgent"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
]

[project.scripts]
devagent = "core.__main__:main"

[tool.setuptools]
include-package-data = false
py-modules = ["agent", "api", "cli", "main"]

[tool.setuptools.packages.find]
include = ["core*", "devagent_studio*"]

[tool.setuptools.package-data]
devagent_studio = ["*.html", "*.js", "*.css"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc", "*.pyo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["transactions", "ubuntu-fs", "build"]
addopts = "--cov=core --cov=api --cov=agent --cov-report=term-missing --cov-fail-under=100"
