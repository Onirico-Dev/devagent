[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devagent"
version = "0.4.3"
description = "DevAgent"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
]

[project.scripts]
devagent = "core.__main__:main"

[tool.setuptools]
include-package-data = true
py-modules = ["agent", "api", "cli", "main"]

[tool.setuptools.packages.find]
include = ["core*"]
