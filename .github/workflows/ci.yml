name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Compile sources
        run: python -m py_compile api.py agent.py main.py $(find core -name "*.py" -print)

      - name: Run tests and verify production coverage
        run: pytest -q --cov=core --cov=api --cov=agent --cov-report=term-missing --cov-fail-under=100
